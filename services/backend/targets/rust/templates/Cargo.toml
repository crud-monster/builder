[package]
name = "__CRATE_NAME__"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
axum = "0.8"
async-graphql = "7.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
mongodb = "3"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
