services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gmb_test
      POSTGRES_USER: gmb
      POSTGRES_PASSWORD: gmb_test_only
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gmb -d gmb_test']
      interval: 2s
      timeout: 5s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gmb_test
      MYSQL_USER: gmb
      MYSQL_PASSWORD: gmb_test_only
      MYSQL_ROOT_PASSWORD: gmb_root_test_only
    ports:
      - '127.0.0.1:13306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ugmb', '-pgmb_test_only']
      interval: 2s
      timeout: 5s
      retries: 60
